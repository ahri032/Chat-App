<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ChatApp</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
  body { display: flex; height: 100vh; background: #f0f0f0; }

  #sidebar {
    width: 220px; background: #1e1e2e; color: #cdd6f4; display: flex;
    flex-direction: column; padding: 12px; gap: 8px;
  }
  #sidebar h2 { font-size: 14px; color: #89b4fa; margin-bottom: 4px; }
  #room-list { flex: 1; overflow-y: auto; }
  .room-item {
    padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .room-item:hover, .room-item.active { background: #313244; }
  #auth-area { border-top: 1px solid #313244; padding-top: 8px; font-size: 12px; }

  #main { flex: 1; display: flex; flex-direction: column; }
  #messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .msg-row { display: flex; flex-direction: column; max-width: 60%; }
  .msg-row.mine { align-self: flex-end; align-items: flex-end; }
  .msg-row.theirs { align-self: flex-start; }
  .msg-sender { font-size: 11px; color: #888; margin-bottom: 2px; }
  .msg-bubble {
    padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4;
  }
  .mine .msg-bubble { background: #fee500; }
  .theirs .msg-bubble { background: #fff; }
  .system-msg { text-align: center; color: #aaa; font-size: 12px; }

  #room-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-bottom: 1px solid #ddd; background: #fff;
    font-weight: bold; font-size: 15px;
  }
  #room-header.hidden { display: none; }
  #leave-btn {
    background: #ff6b6b; color: #fff; font-size: 12px;
    padding: 6px 12px; border-radius: 6px; font-weight: bold;
  }
  #input-area {
    display: flex; gap: 8px; padding: 12px; border-top: 1px solid #ddd;
    background: #fff;
  }
  #msg-input {
    flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 14px;
  }
  button {
    padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer;
    background: #fee500; font-weight: bold;
  }

  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
  }
  #overlay.hidden { display: none; }
  #login-box {
    background: #fff; padding: 32px; border-radius: 12px;
    display: flex; flex-direction: column; gap: 12px; width: 300px;
  }
  #login-box h2 { text-align: center; }
  #login-box input {
    padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px;
  }
  #login-box .row { display: flex; gap: 8px; }
  #login-box button { flex: 1; }
  #login-error { color: red; font-size: 12px; text-align: center; }

  #register-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center; }
  #register-overlay.hidden { display: none; }
  #register-box {
    background: #fff; padding: 32px; border-radius: 12px;
    display: flex; flex-direction: column; gap: 12px; width: 300px;
  }
  #register-box h2 { text-align: center; }
  #register-box input {
    padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px;
  }
  #register-box .row { display: flex; gap: 8px; }
  #register-box button { flex: 1; }
  #register-error { color: red; font-size: 12px; text-align: center; }
</style>
</head>
<body>

<!-- 로그인 오버레이 -->
<div id="overlay">
  <div id="login-box">
    <h2>ChatApp</h2>
    <input id="un" placeholder="아이디" />
    <input id="pw" placeholder="비밀번호" type="password" />
    <div class="row">
      <button onclick="doLogin()">로그인</button>
      <button onclick="openRegister()">회원가입</button>
    </div>
    <div id="login-error"></div>
  </div>
</div>

<!-- 회원가입 오버레이 -->
<div id="register-overlay" class="hidden">
  <div id="register-box">
    <h2>회원가입</h2>
    <input id="reg-un" placeholder="아이디" />
    <input id="reg-pw" placeholder="비밀번호" type="password" />
    <input id="reg-pw2" placeholder="비밀번호 확인" type="password" />
    <div class="row">
      <button onclick="closeRegister()">취소</button>
      <button onclick="doRegister()">가입하기</button>
    </div>
    <div id="register-error"></div>
  </div>
</div>

<!-- 메인 화면 -->
<div id="sidebar">
  <h2>채팅방</h2>
  <div id="room-list"></div>
  <div id="auth-area">
    <div id="user-label"></div>
    <button style="width:100%;margin-top:6px;" onclick="createRoom()">+ 방 만들기</button>
  </div>
</div>

<div id="main">
  <div id="room-header" class="hidden">
    <span id="room-title"></span>
    <button id="leave-btn" onclick="leaveRoom()">나가기</button>
  </div>
  <div id="messages"></div>
  <div id="input-area">
    <input id="msg-input" placeholder="메시지 입력..." onkeydown="if(event.key==='Enter') sendMsg()" />
    <button onclick="sendMsg()">전송</button>
  </div>
</div>

<script>
let token = null;
let currentRoom = null;
let ws = null;
let currentUsername = null;

// 페이지 로드 시 저장된 로그인 정보 복원
(async () => {
  const savedToken = localStorage.getItem("token");
  const savedUsername = localStorage.getItem("username");
  if (savedToken && savedUsername) {
    try {
      token = savedToken;
      currentUsername = savedUsername;
      await onLoginSuccess(savedToken, savedUsername);
    } catch (e) {
      localStorage.removeItem("token");
      localStorage.removeItem("username");
    }
  }
})();

async function api(method, path, body) {
  const url = new URL(path, location.href);
  if (token) url.searchParams.set("token", token);
  const res = await fetch(url, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.detail || "오류");
  return data;
}

async function doLogin() {
  try {
    const r = await api("POST", "/login", {
      username: document.getElementById("un").value,
      password: document.getElementById("pw").value,
    });
    onLoginSuccess(r.token, document.getElementById("un").value);
  } catch (e) {
    document.getElementById("login-error").textContent = e.message;
  }
}

function openRegister() {
  document.getElementById("register-error").textContent = "";
  document.getElementById("reg-un").value = "";
  document.getElementById("reg-pw").value = "";
  document.getElementById("reg-pw2").value = "";
  document.getElementById("register-overlay").classList.remove("hidden");
}

function closeRegister() {
  document.getElementById("register-overlay").classList.add("hidden");
}

async function doRegister() {
  const username = document.getElementById("reg-un").value.trim();
  const password = document.getElementById("reg-pw").value;
  const password2 = document.getElementById("reg-pw2").value;
  const errEl = document.getElementById("register-error");

  if (!username || !password) { errEl.textContent = "아이디와 비밀번호를 입력해주세요."; return; }
  if (password !== password2) { errEl.textContent = "비밀번호가 일치하지 않습니다."; return; }

  try {
    await api("POST", "/register", { username, password });
    closeRegister();
    document.getElementById("un").value = username;
    document.getElementById("pw").value = "";
    document.getElementById("login-error").textContent = "가입 완료! 로그인해주세요.";
    document.getElementById("login-error").style.color = "green";
  } catch (e) {
    errEl.textContent = e.message;
  }
}

async function onLoginSuccess(t, username) {
  token = t;
  currentUsername = username;
  localStorage.setItem("token", t);
  localStorage.setItem("username", username);
  document.getElementById("overlay").classList.add("hidden");
  document.getElementById("user-label").textContent = `👤 ${username}`;
  await loadRooms();
}

async function loadRooms() {
  const rooms = await api("GET", "/rooms");
  const list = document.getElementById("room-list");
  list.innerHTML = "";
  rooms.forEach(r => {
    const div = document.createElement("div");
    div.className = "room-item";
    div.textContent = "# " + r.name;
    div.onclick = () => joinRoom(r.id, r.name, div);
    list.appendChild(div);
  });
}

async function createRoom() {
  const name = prompt("방 이름:");
  if (!name) return;
  await api("POST", "/rooms", { name });
  await loadRooms();
}

async function joinRoom(roomId, roomName, el) {
  document.querySelectorAll(".room-item").forEach(e => e.classList.remove("active"));
  el.classList.add("active");
  currentRoom = roomId;

  document.getElementById("room-title").textContent = "# " + roomName;
  document.getElementById("room-header").classList.remove("hidden");

  await api("POST", `/rooms/${roomId}/join`);

  if (ws) ws.close();
  const msgs = await api("GET", `/rooms/${roomId}/messages`);
  renderHistory(msgs);

  const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${wsProtocol}//${location.host}/ws/${roomId}?token=${token}`;
  ws = new WebSocket(wsUrl);
  ws.onmessage = e => {
    const data = JSON.parse(e.data);
    if (data.type === "system") appendSystem(data.content);
    else appendMessage(data.sender, data.content, false);
  };
}

async function leaveRoom() {
  if (!currentRoom) return;
  try {
    await api("DELETE", `/rooms/${currentRoom}/leave`);
  } catch (_) {}
  if (ws) { ws.close(); ws = null; }
  currentRoom = null;
  document.getElementById("messages").innerHTML = "";
  document.getElementById("room-header").classList.add("hidden");
  document.querySelectorAll(".room-item").forEach(e => e.classList.remove("active"));
  await loadRooms();
}

function renderHistory(msgs) {
  document.getElementById("messages").innerHTML = "";
  msgs.forEach(m => appendMessage(m.sender, m.content, m.sender === currentUsername));
}

function appendMessage(sender, content, isMine) {
  const box = document.getElementById("messages");
  const row = document.createElement("div");
  row.className = "msg-row " + (isMine ? "mine" : "theirs");
  row.innerHTML = `<div class="msg-sender">${sender}</div><div class="msg-bubble">${escHtml(content)}</div>`;
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}

function appendSystem(text) {
  const box = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "system-msg";
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function sendMsg() {
  const input = document.getElementById("msg-input");
  const text = input.value.trim();
  if (!text || !ws) return;
  ws.send(text);
  appendMessage("나", text, true);
  input.value = "";
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
</script>
</body>
</html>
