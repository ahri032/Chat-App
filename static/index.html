<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }

  /* ── CSS 변수 ── */
  :root, [data-theme="light"] {
    --bg: #f0f2f5;
    --chat-bg: #f0f2f5;
    --surface: #ffffff;
    --border: #eeeeee;
    --border-input: #e8e8e8;
    --text: #111111;
    --text-muted: #888888;
    --text-sub: #aaaaaa;
    --bubble-mine: #4e80f5;
    --bubble-mine-text: #ffffff;
    --bubble-theirs: #ffffff;
    --bubble-shadow: 0 1px 2px rgba(0,0,0,0.1);
    --input-bg: #f8f8f8;
    --input-bg-focus: #ffffff;
    --btn-primary: #4e80f5;
    --btn-primary-text: #ffffff;
    --btn-secondary: #f0f0f0;
    --btn-secondary-text: #555555;
    --surface-hover: #f5f5f5;
    --scrollbar-thumb: #d0d0d0;
    --profile-code-color: #313244;
  }

  [data-theme="dark"] {
    --bg: #181825;
    --chat-bg: #181825;
    --surface: #1e1e2e;
    --border: #313244;
    --border-input: #45475a;
    --text: #cdd6f4;
    --text-muted: #7f849c;
    --text-sub: #6c7086;
    --bubble-mine: #89b4fa;
    --bubble-mine-text: #1e1e2e;
    --bubble-theirs: #313244;
    --bubble-shadow: none;
    --input-bg: #313244;
    --input-bg-focus: #45475a;
    --btn-primary: #89b4fa;
    --btn-primary-text: #1e1e2e;
    --btn-secondary: #45475a;
    --btn-secondary-text: #cdd6f4;
    --surface-hover: #313244;
    --scrollbar-thumb: #45475a;
    --profile-code-color: #89b4fa;
  }

  body { display: flex; flex-direction: column; height: 100vh; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
  #sidebar ::-webkit-scrollbar-thumb { background: #45475a; }

  /* ── 상단 헤더 & 탭 ── */
  #app-header {
    display: flex; align-items: center; justify-content: space-between;
    background: #1e1e2e; color: #cdd6f4; padding: 0 16px; height: 52px; flex-shrink: 0;
  }
  #app-title { font-size: 16px; font-weight: bold; color: #89b4fa; }
  #tab-nav { display: flex; gap: 4px; }
  .tab-btn {
    padding: 8px 20px; border: none; border-radius: 8px; cursor: pointer;
    background: transparent; color: #cdd6f4; font-size: 14px; font-weight: bold; position: relative;
  }
  .tab-btn:hover { background: #313244; }
  .tab-btn.active { background: #313244; color: #89b4fa; }
  .badge {
    position: absolute; top: 4px; right: 4px; background: #f38ba8;
    color: #fff; border-radius: 50%; width: 16px; height: 16px;
    font-size: 10px; display: flex; align-items: center; justify-content: center;
  }
  .badge.hidden { display: none; }

  /* ── 탭 컨텐츠 ── */
  .tab-content { display: none; flex: 1; overflow: hidden; }
  .tab-content.active { display: flex; }

  /* ── 채팅 탭 ── */
  #sidebar {
    width: 220px; background: #1e1e2e; color: #cdd6f4;
    display: flex; flex-direction: column; padding: 12px; gap: 8px; flex-shrink: 0;
  }
  #sidebar h2 { font-size: 13px; color: #89b4fa; margin-bottom: 4px; }
  #room-list { flex: 1; overflow-y: auto; }
  .room-item { padding: 9px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: background 0.15s; }
  .room-item:hover, .room-item.active { background: #313244; }
  #sidebar-actions { border-top: 1px solid #313244; padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .sidebar-btn { width: 100%; padding: 9px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; transition: filter 0.15s; }
  .sidebar-btn.primary { background: #89b4fa; color: #1e1e2e; }
  .sidebar-btn.primary:hover { filter: brightness(1.1); }

  #chat-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #room-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 16px; border-bottom: 1px solid var(--border); background: var(--surface);
    font-weight: 700; font-size: 15px; flex-shrink: 0; color: var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  #room-header.hidden { display: none; }
  #room-header-btns { display: flex; gap: 8px; }
  #invite-btn {
    background: var(--btn-primary); color: var(--btn-primary-text); font-size: 12px;
    padding: 6px 12px; border-radius: 6px; font-weight: bold; border: none; cursor: pointer;
  }
  #leave-btn {
    background: #ff6b6b; color: #fff; font-size: 12px;
    padding: 6px 12px; border-radius: 6px; font-weight: bold; border: none; cursor: pointer;
  }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 2px; background: var(--chat-bg); }
  .msg-row { display: flex; flex-direction: column; max-width: 65%; margin-top: 10px; }
  .msg-row.grouped { margin-top: 2px; }
  .msg-row.mine { align-self: flex-end; align-items: flex-end; }
  .msg-row.theirs { align-self: flex-start; }
  .msg-sender { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; font-weight: 500; }
  .msg-with-time { display: flex; align-items: flex-end; gap: 5px; }
  .mine .msg-with-time { flex-direction: row-reverse; }
  .msg-bubble { padding: 9px 13px; border-radius: 14px; font-size: 14px; line-height: 1.45; }
  .mine .msg-bubble { background: var(--bubble-mine); color: var(--bubble-mine-text); }
  .theirs .msg-bubble { background: var(--bubble-theirs); box-shadow: var(--bubble-shadow); color: var(--text); }
  .msg-time { font-size: 10px; color: var(--text-sub); white-space: nowrap; padding-bottom: 2px; }
  .date-sep {
    display: flex; align-items: center; gap: 8px;
    color: var(--text-sub); font-size: 11px; margin: 14px 0; align-self: stretch;
  }
  .date-sep::before, .date-sep::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .system-msg { text-align: center; color: var(--text-sub); font-size: 12px; margin: 4px 0; }
  #input-area { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; align-items: center; }
  #msg-input { flex: 1; padding: 10px 16px; border: 1.5px solid var(--border-input); border-radius: 22px; font-size: 14px; background: var(--input-bg); color: var(--text); outline: none; transition: border-color 0.15s, background 0.15s; }
  #msg-input:focus { border-color: var(--btn-primary); background: var(--input-bg-focus); }
  #send-btn { width: 40px; height: 40px; padding: 0; border: none; border-radius: 50%; cursor: pointer; background: var(--btn-primary); color: var(--btn-primary-text); font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: filter 0.15s, transform 0.1s; }
  #send-btn:hover { filter: brightness(0.93); }
  #send-btn:active { transform: scale(0.92); }

  /* ── 친구 탭 ── */
  #tab-friends { flex-direction: column; background: var(--bg); overflow-y: auto; }
  #friends-inner { max-width: 600px; width: 100%; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; }
  .section-title { font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 10px; }
  #user-search-box { display: flex; gap: 8px; }
  #user-search-box input { flex: 1; padding: 10px; border: 1px solid var(--border-input); border-radius: 8px; font-size: 14px; background: var(--surface); color: var(--text); outline: none; }
  #user-search-btn { padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; background: var(--btn-primary); color: var(--btn-primary-text); font-weight: bold; }
  #search-result { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .user-item, .friend-item, .request-item, .browse-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px;
    background: var(--surface); color: var(--text); transition: box-shadow 0.15s;
  }
  .user-item:hover, .friend-item:hover, .browse-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  .user-item button, .friend-item button, .request-item button, .browse-item button {
    padding: 5px 14px; border: none; border-radius: 6px; cursor: pointer;
    background: var(--btn-primary); color: var(--btn-primary-text); font-size: 12px; font-weight: bold;
  }
  .request-item .btn-row { display: flex; gap: 6px; }
  .request-item .btn-accept { background: #a6e3a1 !important; color: #1a3a1a !important; }
  .request-item .btn-reject { background: #f38ba8 !important; color: #fff !important; }
  .browse-item button.joined { background: var(--btn-secondary) !important; color: var(--btn-secondary-text) !important; cursor: default; }
  #friend-list, #request-list, #all-rooms-list { display: flex; flex-direction: column; gap: 8px; }
  .empty-msg { color: var(--text-sub); font-size: 13px; }

  /* ── 프로필 탭 ── */
  #tab-profile { flex-direction: column; background: var(--bg); align-items: center; justify-content: center; }
  #profile-inner { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 300px; }
  #profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: #313244; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #cdd6f4; }
  #profile-username { font-size: 20px; font-weight: bold; color: var(--text); }
  #profile-code-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; text-align: center; }
  #profile-friend-code { font-size: 20px; font-weight: bold; letter-spacing: 3px; color: var(--profile-code-color); }
  #profile-copy-btn { padding: 6px 12px; font-size: 12px; background: var(--btn-secondary); color: var(--btn-secondary-text); border: none; border-radius: 6px; cursor: pointer; }
  #status-input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--surface); color: var(--text); text-align: center; outline: none; }
  #theme-toggle-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; background: var(--btn-secondary); color: var(--btn-secondary-text); font-weight: bold; font-size: 15px; }
  #logout-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; background: #ff6b6b; color: #fff; font-weight: bold; font-size: 15px; }

  /* ── 오버레이 공통 ── */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .overlay.hidden { display: none; }
  .modal-box { background: var(--surface); padding: 28px; border-radius: 16px; display: flex; flex-direction: column; gap: 12px; width: 320px; max-height: 80vh; box-shadow: 0 8px 40px rgba(0,0,0,0.2); }
  .modal-box h2 { text-align: center; font-size: 17px; font-weight: 700; color: var(--text); }
  .modal-box input { padding: 10px 14px; border: 1.5px solid var(--border-input); border-radius: 10px; font-size: 14px; outline: none; background: var(--input-bg); color: var(--text); transition: border-color 0.15s; }
  .modal-box input:focus { border-color: var(--btn-primary); }
  .modal-box .row { display: flex; gap: 8px; }
  .modal-box .row button { flex: 1; padding: 11px; border: none; border-radius: 10px; cursor: pointer; background: var(--btn-primary); color: var(--btn-primary-text); font-weight: 700; font-size: 14px; transition: filter 0.15s; }
  .modal-box .row button:hover { filter: brightness(0.95); }
  .modal-box .row button.secondary { background: var(--btn-secondary); color: var(--btn-secondary-text); }
  .error-msg { color: #f38ba8; font-size: 12px; text-align: center; }
  .friend-check-list { overflow-y: auto; max-height: 200px; display: flex; flex-direction: column; gap: 6px; }
  .friend-check-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; cursor: pointer; transition: background 0.15s; color: var(--text); background: var(--surface); }
  .friend-check-item:hover { background: var(--surface-hover); }
  .friend-check-item input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }

  /* ── 채팅 빈 화면 ── */
  #chat-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: var(--chat-bg); user-select: none; }
  .chat-empty-icon { font-size: 52px; opacity: 0.35; }
  .chat-empty-title { font-size: 16px; font-weight: 700; color: var(--text-sub); }
  .chat-empty-sub { font-size: 13px; color: var(--text-sub); opacity: 0.7; }
  #chat-main.no-room #messages,
  #chat-main.no-room #input-area { display: none; }
  #chat-main:not(.no-room) #chat-empty { display: none; }

  /* ── 모바일: 하단 탭 ── */
  @media (max-width: 600px) {
    #app-header { display: none; }
    #tab-nav-bottom { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: #1e1e2e; height: 56px; z-index: 50; }
    .tab-btn-bottom { flex: 1; border: none; background: transparent; color: #cdd6f4; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; }
    .tab-btn-bottom.active { color: #89b4fa; }
    .tab-btn-bottom span { font-size: 18px; }
    .tab-content.active { padding-bottom: 56px; }
    #sidebar { width: 100%; }
    #tab-chat { flex-direction: column; }
  }
  @media (min-width: 601px) { #tab-nav-bottom { display: none; } }
</style>
</head>
<body>

<!-- 상단 헤더 & 탭 (웹) -->
<header id="app-header">
  <div id="app-title">💬 ChatApp</div>
  <nav id="tab-nav">
    <button class="tab-btn active" onclick="switchTab('chat')">💬 채팅</button>
    <button class="tab-btn" onclick="switchTab('friends')">👥 친구<span id="req-badge" class="badge hidden"></span></button>
    <button class="tab-btn" onclick="switchTab('profile')">👤 프로필</button>
  </nav>
</header>

<!-- 채팅 탭 -->
<div id="tab-chat" class="tab-content active">
  <div id="sidebar">
    <h2>채팅방</h2>
    <div id="room-list"></div>
    <div id="sidebar-actions">
      <button class="sidebar-btn primary" onclick="createRoom()">+ 방 만들기</button>
    </div>
  </div>
  <div id="chat-main" class="no-room">
    <div id="room-header" class="hidden">
      <span id="room-title"></span>
      <div id="room-header-btns">
        <button id="invite-btn" onclick="openInvite()">+ 친구 초대</button>
        <button id="leave-btn" onclick="leaveRoom()">나가기</button>
      </div>
    </div>
    <div id="chat-empty">
      <div class="chat-empty-icon">💬</div>
      <div class="chat-empty-title">채팅방을 선택하세요</div>
      <div class="chat-empty-sub">왼쪽에서 채팅방을 고르거나 새로 만들어보세요.</div>
    </div>
    <div id="messages"></div>
    <div id="input-area">
      <input id="msg-input" placeholder="메시지 입력..." onkeydown="if(event.key==='Enter') sendMsg()" />
      <button id="send-btn" onclick="sendMsg()">↑</button>
    </div>
  </div>
</div>

<!-- 친구 탭 -->
<div id="tab-friends" class="tab-content">
  <div id="friends-inner">
    <div>
      <div class="section-title">➕ 친구 추가</div>
      <div id="user-search-box">
        <input id="friend-code-input" placeholder="친구 코드 8자리 입력" maxlength="8"
          style="text-transform:uppercase" onkeydown="if(event.key==='Enter') addByCode()" />
        <button id="user-search-btn" onclick="addByCode()">추가</button>
      </div>
      <div id="search-result"></div>
    </div>
    <div>
      <div class="section-title">📨 받은 친구 요청</div>
      <div id="request-list"><div class="empty-msg">받은 요청이 없습니다.</div></div>
    </div>
    <div>
      <div class="section-title">👥 친구 목록</div>
      <div id="friend-list"><div class="empty-msg">아직 친구가 없습니다.</div></div>
    </div>
    <div>
      <div class="section-title">🏠 전체 채팅방</div>
      <div id="all-rooms-list"></div>
    </div>
  </div>
</div>

<!-- 프로필 탭 -->
<div id="tab-profile" class="tab-content">
  <div id="profile-inner">
    <div id="profile-avatar">👤</div>
    <div id="profile-username">-</div>
    <div style="text-align:center">
      <div id="profile-code-label">내 친구 코드</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
        <span id="profile-friend-code">-</span>
        <button id="profile-copy-btn" onclick="copyCode()">복사</button>
      </div>
    </div>
    <input id="status-input" placeholder="상태 메시지를 입력하세요..." />
    <button id="theme-toggle-btn" onclick="toggleTheme()">🌙 다크 모드</button>
    <button id="logout-btn" onclick="logout()">로그아웃</button>
  </div>
</div>

<!-- 하단 탭 (모바일) -->
<nav id="tab-nav-bottom">
  <button class="tab-btn-bottom active" onclick="switchTab('chat')"><span>💬</span>채팅</button>
  <button class="tab-btn-bottom" onclick="switchTab('friends')"><span>👥</span>친구</button>
  <button class="tab-btn-bottom" onclick="switchTab('profile')"><span>👤</span>프로필</button>
</nav>

<!-- 방 만들기 모달 -->
<div id="create-room-overlay" class="overlay hidden">
  <div class="modal-box">
    <h2>방 만들기</h2>
    <input id="room-name-input" placeholder="방 이름" onkeydown="if(event.key==='Enter') submitCreateRoom()" />
    <div class="section-title" style="margin-bottom:4px;">친구 초대 (선택)</div>
    <div id="create-friend-list" class="friend-check-list"></div>
    <div class="row">
      <button class="secondary" onclick="closeCreateRoom()">취소</button>
      <button onclick="submitCreateRoom()">만들기</button>
    </div>
    <div id="create-room-error" class="error-msg"></div>
  </div>
</div>

<!-- 방 내 초대 모달 -->
<div id="invite-overlay" class="overlay hidden">
  <div class="modal-box">
    <h2>친구 초대</h2>
    <div id="invite-friend-list" class="friend-check-list"></div>
    <div class="row">
      <button class="secondary" onclick="closeInvite()">취소</button>
      <button onclick="submitInvite()">초대</button>
    </div>
    <div id="invite-error" class="error-msg"></div>
  </div>
</div>

<!-- 로그인 오버레이 -->
<div id="overlay" class="overlay">
  <div class="modal-box">
    <h2>ChatApp</h2>
    <input id="un" placeholder="아이디" />
    <input id="pw" placeholder="비밀번호" type="password" onkeydown="if(event.key==='Enter') doLogin()" />
    <div class="row">
      <button onclick="doLogin()">로그인</button>
      <button class="secondary" onclick="openRegister()">회원가입</button>
    </div>
    <div id="login-error" class="error-msg"></div>
  </div>
</div>

<!-- 회원가입 오버레이 -->
<div id="register-overlay" class="overlay hidden">
  <div class="modal-box">
    <h2>회원가입</h2>
    <input id="reg-un" placeholder="아이디" />
    <input id="reg-pw" placeholder="비밀번호" type="password" />
    <input id="reg-pw2" placeholder="비밀번호 확인" type="password" />
    <div class="row">
      <button class="secondary" onclick="closeRegister()">취소</button>
      <button onclick="doRegister()">가입하기</button>
    </div>
    <div id="register-error" class="error-msg"></div>
  </div>
</div>

<script>
let token = null;
let currentRoom = null;
let ws = null;
let currentUsername = null;
let friendsCache = [];
let heartbeatInterval = null;
let lastMsgSender = null;
let lastMsgDate = null;
let inviteTargetRoom = null;

(async () => {
  initTheme();
  const savedToken = localStorage.getItem("token");
  const savedUsername = localStorage.getItem("username");
  if (savedToken && savedUsername) {
    try {
      token = savedToken;
      currentUsername = savedUsername;
      await onLoginSuccess(savedToken, savedUsername);
    } catch (e) {
      localStorage.removeItem("token");
      localStorage.removeItem("username");
    }
  }
})();

// ── 탭 전환 ──────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".tab-btn, .tab-btn-bottom").forEach(el => el.classList.remove("active"));
  document.getElementById(`tab-${name}`).classList.add("active");
  document.querySelectorAll(`[onclick="switchTab('${name}')"]`).forEach(el => el.classList.add("active"));
  if (name === "friends") loadFriendsTab();
  if (name === "profile") loadProfile();
}

// ── API ──────────────────────────────────────────
async function api(method, path, body) {
  const url = new URL(path, location.href);
  if (token) url.searchParams.set("token", token);
  const res = await fetch(url, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.detail || "오류");
  return data;
}

// ── 인증 ─────────────────────────────────────────
async function doLogin() {
  try {
    const r = await api("POST", "/login", {
      username: document.getElementById("un").value,
      password: document.getElementById("pw").value,
    });
    await onLoginSuccess(r.token, document.getElementById("un").value);
  } catch (e) {
    document.getElementById("login-error").textContent = e.message;
  }
}

function openRegister() {
  document.getElementById("register-error").textContent = "";
  ["reg-un","reg-pw","reg-pw2"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("register-overlay").classList.remove("hidden");
}
function closeRegister() { document.getElementById("register-overlay").classList.add("hidden"); }

async function doRegister() {
  const username = document.getElementById("reg-un").value.trim();
  const password = document.getElementById("reg-pw").value;
  const password2 = document.getElementById("reg-pw2").value;
  const errEl = document.getElementById("register-error");
  if (!username || !password) { errEl.textContent = "아이디와 비밀번호를 입력해주세요."; return; }
  if (password !== password2) { errEl.textContent = "비밀번호가 일치하지 않습니다."; return; }
  try {
    await api("POST", "/register", { username, password });
    closeRegister();
    document.getElementById("un").value = username;
    document.getElementById("pw").value = "";
    document.getElementById("login-error").textContent = "가입 완료! 로그인해주세요.";
    document.getElementById("login-error").style.color = "green";
  } catch (e) { errEl.textContent = e.message; }
}

async function onLoginSuccess(t, username) {
  token = t;
  currentUsername = username;
  localStorage.setItem("token", t);
  localStorage.setItem("username", username);
  document.getElementById("overlay").classList.add("hidden");
  await loadRooms();
  pollUpdates();
}

function logout() {
  token = null; currentUsername = null; friendsCache = [];
  localStorage.removeItem("token"); localStorage.removeItem("username");
  if (ws) { ws.close(); ws = null; }
  currentRoom = null;
  document.getElementById("messages").innerHTML = "";
  document.getElementById("room-header").classList.add("hidden");
  document.getElementById("un").value = "";
  document.getElementById("pw").value = "";
  document.getElementById("login-error").textContent = "";
  document.getElementById("login-error").style.color = "red";
  document.getElementById("overlay").classList.remove("hidden");
  switchTab("chat");
}

// ── 폴링 (방 목록·친구요청·친구목록 자동 갱신) ──
async function pollUpdates() {
  if (!token) return;
  try {
    await loadRooms();
    const reqs = await api("GET", "/friends/requests");
    const badge = document.getElementById("req-badge");
    if (reqs.length > 0) { badge.textContent = reqs.length; badge.classList.remove("hidden"); }
    else badge.classList.add("hidden");
    if (document.getElementById("tab-friends").classList.contains("active")) {
      await loadFriendsTab();
    } else {
      try { friendsCache = await api("GET", "/friends"); } catch (_) {}
    }
  } catch (_) {}
  setTimeout(pollUpdates, 5000);
}

// ── 채팅방 ────────────────────────────────────────
async function loadRooms() {
  const rooms = await api("GET", "/rooms");
  const list = document.getElementById("room-list");
  list.innerHTML = "";
  rooms.forEach(r => {
    const div = document.createElement("div");
    div.className = "room-item";
    div.dataset.roomId = r.id;
    if (r.id === currentRoom) div.classList.add("active");
    div.textContent = "# " + r.name;
    div.onclick = () => joinRoom(r.id, r.name, div);
    list.appendChild(div);
  });
}

async function createRoom() {
  document.getElementById("room-name-input").value = "";
  document.getElementById("create-room-error").textContent = "";
  if (friendsCache.length === 0) {
    try { friendsCache = await api("GET", "/friends"); } catch (_) {}
  }
  renderFriendCheckList("create-friend-list", friendsCache);
  document.getElementById("create-room-overlay").classList.remove("hidden");
  setTimeout(() => document.getElementById("room-name-input").focus(), 50);
}
function closeCreateRoom() { document.getElementById("create-room-overlay").classList.add("hidden"); }

async function submitCreateRoom() {
  const name = document.getElementById("room-name-input").value.trim();
  if (!name) { document.getElementById("create-room-error").textContent = "방 이름을 입력해주세요."; return; }
  const checked = [...document.querySelectorAll("#create-friend-list input:checked")].map(el => parseInt(el.value));
  try {
    await api("POST", "/rooms", { name, invite_user_ids: checked });
    closeCreateRoom();
    await loadRooms();
  } catch (e) { document.getElementById("create-room-error").textContent = e.message; }
}

async function joinRoom(roomId, roomName, el) {
  switchTab("chat");
  document.querySelectorAll(".room-item").forEach(e => e.classList.remove("active"));
  el.classList.add("active");
  currentRoom = roomId;
  document.getElementById("chat-main").classList.remove("no-room");
  document.getElementById("room-title").textContent = "# " + roomName;
  document.getElementById("room-header").classList.remove("hidden");
  await api("POST", `/rooms/${roomId}/join`);
  if (ws) { ws.onclose = null; ws.close(); }
  if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
  const msgs = await api("GET", `/rooms/${roomId}/messages`);
  renderHistory(msgs);
  const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${wsProtocol}//${location.host}/ws/${roomId}?token=${token}`);
  ws.onopen = () => {
    heartbeatInterval = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send("__ping__");
    }, 20000);
  };
  ws.onmessage = e => {
    const data = JSON.parse(e.data);
    if (data.type === "system") appendSystem(data.content);
    else appendMessage(data.sender, data.content, false, data.created_at);
  };
  ws.onerror = () => appendSystem("연결 오류가 발생했습니다.");
  ws.onclose = e => {
    if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
    if (currentRoom === roomId && e.code !== 1000) appendSystem("연결이 끊겼습니다. 방을 다시 클릭해 재연결하세요.");
  };
}

async function leaveRoom() {
  if (!currentRoom) return;
  if (ws && ws.readyState === WebSocket.OPEN) ws.send("__leave__");
  if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  try { await api("DELETE", `/rooms/${currentRoom}/leave`); } catch (_) {}
  currentRoom = null;
  lastMsgSender = null;
  lastMsgDate = null;
  document.getElementById("chat-main").classList.add("no-room");
  document.getElementById("messages").innerHTML = "";
  document.getElementById("room-header").classList.add("hidden");
  document.querySelectorAll(".room-item").forEach(e => e.classList.remove("active"));
  await loadRooms();
}

function renderHistory(msgs) {
  document.getElementById("messages").innerHTML = "";
  lastMsgSender = null;
  lastMsgDate = null;
  msgs.forEach(m => appendMessage(m.sender, m.content, m.sender === currentUsername, m.created_at));
}

function appendMessage(sender, content, isMine, timeStr) {
  const box = document.getElementById("messages");
  const time = timeStr ? new Date(timeStr) : new Date();
  const dateKey = time.toLocaleDateString("ko-KR");

  if (dateKey !== lastMsgDate) {
    lastMsgDate = dateKey;
    lastMsgSender = null;
    const today = new Date().toLocaleDateString("ko-KR");
    const yesterday = new Date(Date.now() - 86400000).toLocaleDateString("ko-KR");
    const label = dateKey === today ? "오늘" : dateKey === yesterday ? "어제" : dateKey;
    const sep = document.createElement("div");
    sep.className = "date-sep";
    sep.textContent = label;
    box.appendChild(sep);
  }

  const isGrouped = sender === lastMsgSender;
  lastMsgSender = sender;

  const timeLabel = time.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false });
  const row = document.createElement("div");
  row.className = "msg-row " + (isMine ? "mine" : "theirs") + (isGrouped ? " grouped" : "");
  row.innerHTML = `
    ${!isGrouped ? `<div class="msg-sender">${escHtml(sender)}</div>` : ""}
    <div class="msg-with-time">
      <div class="msg-bubble">${escHtml(content)}</div>
      <span class="msg-time">${timeLabel}</span>
    </div>`;
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}

function appendSystem(text) {
  const box = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "system-msg";
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function sendMsg() {
  const input = document.getElementById("msg-input");
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(text);
  appendMessage(currentUsername, text, true, new Date().toISOString());
  input.value = "";
}

// ── 방 내 초대 ────────────────────────────────────
async function openInvite() {
  inviteTargetRoom = currentRoom;
  document.getElementById("invite-error").textContent = "";
  const members = await api("GET", `/rooms/${inviteTargetRoom}/members`);
  const memberIds = new Set(members.map(m => m.user_id));
  const notInRoom = friendsCache.filter(f => !memberIds.has(f.id));
  renderFriendCheckList("invite-friend-list", notInRoom);
  document.getElementById("invite-overlay").classList.remove("hidden");
}
function closeInvite() { document.getElementById("invite-overlay").classList.add("hidden"); }

async function submitInvite() {
  const checked = [...document.querySelectorAll("#invite-friend-list input:checked")].map(el => parseInt(el.value));
  if (checked.length === 0) { document.getElementById("invite-error").textContent = "초대할 친구를 선택해주세요."; return; }
  try {
    await Promise.all(checked.map(uid => api("POST", `/rooms/${inviteTargetRoom}/invite/${uid}`)));
    closeInvite();
  } catch (e) { document.getElementById("invite-error").textContent = e.message; }
}

// ── 친구 탭 ──────────────────────────────────────
async function loadFriendsTab() {
  await Promise.all([loadFriends(), loadRequests(), loadAllRooms()]);
}

async function loadFriends() {
  const friends = await api("GET", "/friends");
  friendsCache = friends;
  const el = document.getElementById("friend-list");
  if (friends.length === 0) { el.innerHTML = '<div class="empty-msg">아직 친구가 없습니다.</div>'; return; }
  el.innerHTML = "";
  friends.forEach(f => {
    const item = document.createElement("div");
    item.className = "friend-item";
    item.innerHTML = `<span>👤 ${escHtml(f.username)}</span>`;
    el.appendChild(item);
  });
}

async function loadRequests() {
  const reqs = await api("GET", "/friends/requests");
  const badge = document.getElementById("req-badge");
  if (reqs.length > 0) { badge.textContent = reqs.length; badge.classList.remove("hidden"); }
  else badge.classList.add("hidden");
  const el = document.getElementById("request-list");
  if (reqs.length === 0) { el.innerHTML = '<div class="empty-msg">받은 요청이 없습니다.</div>'; return; }
  el.innerHTML = "";
  reqs.forEach(r => {
    const item = document.createElement("div");
    item.className = "request-item";
    item.innerHTML = `
      <span>👤 ${escHtml(r.username)}</span>
      <div class="btn-row">
        <button class="btn-accept" onclick="acceptRequest(${r.id}, this)">수락</button>
        <button class="btn-reject" onclick="rejectRequest(${r.id}, this)">거절</button>
      </div>`;
    el.appendChild(item);
  });
}

async function acceptRequest(id, btn) {
  await api("POST", `/friends/accept/${id}`);
  btn.closest(".request-item").remove();
  await loadFriends();
}

async function rejectRequest(id, btn) {
  await api("POST", `/friends/reject/${id}`);
  btn.closest(".request-item").remove();
}

async function addByCode() {
  const code = document.getElementById("friend-code-input").value.trim().toUpperCase();
  const resultEl = document.getElementById("search-result");
  if (code.length !== 8) { resultEl.innerHTML = '<div class="empty-msg" style="color:red">8자리 코드를 입력해주세요.</div>'; return; }
  try {
    const r = await api("POST", `/friends/request/by-code?code=${encodeURIComponent(code)}`);
    resultEl.innerHTML = `<div class="empty-msg" style="color:green">✓ ${escHtml(r.username)}님에게 친구 요청을 보냈습니다.</div>`;
    document.getElementById("friend-code-input").value = "";
  } catch (e) { resultEl.innerHTML = `<div class="empty-msg" style="color:red">${e.message}</div>`; }
}

async function loadAllRooms() {
  const rooms = await api("GET", "/rooms/all");
  const list = document.getElementById("all-rooms-list");
  if (rooms.length === 0) { list.innerHTML = '<div class="empty-msg">개설된 방이 없습니다.</div>'; return; }
  list.innerHTML = "";
  rooms.forEach(r => {
    const item = document.createElement("div");
    item.className = "browse-item";
    item.innerHTML = `
      <span># ${escHtml(r.name)}</span>
      <button class="${r.joined ? 'joined' : ''}" onclick="browseJoin(${r.id}, this)" ${r.joined ? 'disabled' : ''}>
        ${r.joined ? '참가중' : '참가'}
      </button>`;
    list.appendChild(item);
  });
}

async function browseJoin(roomId, btn) {
  await api("POST", `/rooms/${roomId}/join`);
  btn.textContent = "참가중"; btn.classList.add("joined"); btn.disabled = true;
  await loadRooms();
}

// ── 친구 체크리스트 렌더 ─────────────────────────
function renderFriendCheckList(containerId, excludeFilter) {
  const container = document.getElementById(containerId);
  const list = excludeFilter.length > 0 ? excludeFilter : friendsCache;
  if (list.length === 0) {
    container.innerHTML = '<div class="empty-msg">초대할 친구가 없습니다.</div>'; return;
  }
  container.innerHTML = "";
  list.forEach(f => {
    const label = document.createElement("label");
    label.className = "friend-check-item";
    label.innerHTML = `<input type="checkbox" value="${f.id}" /><span>👤 ${escHtml(f.username)}</span>`;
    container.appendChild(label);
  });
}

// ── 프로필 탭 ────────────────────────────────────
async function loadProfile() {
  document.getElementById("profile-username").textContent = currentUsername || "-";
  try {
    const me = await api("GET", "/me");
    document.getElementById("profile-friend-code").textContent = me.friend_code;
  } catch (_) {}
}

function copyCode() {
  const code = document.getElementById("profile-friend-code").textContent;
  navigator.clipboard.writeText(code);
  const btn = event.target;
  btn.textContent = "복사됨!";
  setTimeout(() => btn.textContent = "복사", 1500);
}

// ── 테마 ─────────────────────────────────────────
function initTheme() {
  const saved = localStorage.getItem("theme") || "light";
  document.documentElement.setAttribute("data-theme", saved);
  const btn = document.getElementById("theme-toggle-btn");
  if (btn) btn.textContent = saved === "dark" ? "☀️ 라이트 모드" : "🌙 다크 모드";
}

function toggleTheme() {
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";
  const next = isDark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
  document.getElementById("theme-toggle-btn").textContent = next === "dark" ? "☀️ 라이트 모드" : "🌙 다크 모드";
}

// ── 유틸 ─────────────────────────────────────────
function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
