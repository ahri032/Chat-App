<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatApp</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
  body { display: flex; flex-direction: column; height: 100vh; background: #f0f0f0; }

  /* ── 상단 헤더 & 탭 ── */
  #app-header {
    display: flex; align-items: center; justify-content: space-between;
    background: #1e1e2e; color: #cdd6f4; padding: 0 16px; height: 52px;
    flex-shrink: 0;
  }
  #app-title { font-size: 16px; font-weight: bold; color: #89b4fa; }
  #tab-nav { display: flex; gap: 4px; }
  .tab-btn {
    padding: 8px 20px; border: none; border-radius: 8px; cursor: pointer;
    background: transparent; color: #cdd6f4; font-size: 14px; font-weight: bold;
  }
  .tab-btn:hover { background: #313244; }
  .tab-btn.active { background: #313244; color: #89b4fa; }

  /* ── 탭 컨텐츠 ── */
  .tab-content { display: none; flex: 1; overflow: hidden; }
  .tab-content.active { display: flex; }

  /* ── 채팅 탭 ── */
  #sidebar {
    width: 220px; background: #1e1e2e; color: #cdd6f4;
    display: flex; flex-direction: column; padding: 12px; gap: 8px; flex-shrink: 0;
  }
  #sidebar h2 { font-size: 13px; color: #89b4fa; margin-bottom: 4px; }
  #room-list { flex: 1; overflow-y: auto; }
  .room-item {
    padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .room-item:hover, .room-item.active { background: #313244; }
  #sidebar-actions { border-top: 1px solid #313244; padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .sidebar-btn {
    width: 100%; padding: 8px; border: none; border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: bold;
  }
  .sidebar-btn.yellow { background: #fee500; color: #000; }
  .sidebar-btn.dark { background: #313244; color: #cdd6f4; }

  #chat-main { flex: 1; display: flex; flex-direction: column; }
  #room-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-bottom: 1px solid #ddd; background: #fff;
    font-weight: bold; font-size: 15px; flex-shrink: 0;
  }
  #room-header.hidden { display: none; }
  #leave-btn {
    background: #ff6b6b; color: #fff; font-size: 12px;
    padding: 6px 12px; border-radius: 6px; font-weight: bold; border: none; cursor: pointer;
  }
  #messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .msg-row { display: flex; flex-direction: column; max-width: 60%; }
  .msg-row.mine { align-self: flex-end; align-items: flex-end; }
  .msg-row.theirs { align-self: flex-start; }
  .msg-sender { font-size: 11px; color: #888; margin-bottom: 2px; }
  .msg-bubble { padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
  .mine .msg-bubble { background: #fee500; }
  .theirs .msg-bubble { background: #fff; }
  .system-msg { text-align: center; color: #aaa; font-size: 12px; }
  #input-area {
    display: flex; gap: 8px; padding: 12px; border-top: 1px solid #ddd;
    background: #fff; flex-shrink: 0;
  }
  #msg-input {
    flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px;
  }
  #send-btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; background: #fee500; font-weight: bold; }

  /* ── 친구 탭 ── */
  #tab-friends { flex-direction: column; background: #fff; }
  #friends-inner { max-width: 600px; width: 100%; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; overflow-y: auto; }
  .section-title { font-size: 14px; font-weight: bold; color: #555; margin-bottom: 8px; }
  #user-search-box { display: flex; gap: 8px; }
  #user-search-input {
    flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px;
  }
  #user-search-btn { padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; background: #fee500; font-weight: bold; }
  #search-result { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .user-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; border: 1px solid #eee; border-radius: 8px; font-size: 14px;
  }
  .user-item button { padding: 5px 14px; border: none; border-radius: 6px; cursor: pointer; background: #fee500; font-size: 12px; font-weight: bold; }
  #friend-list { display: flex; flex-direction: column; gap: 8px; }
  .friend-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border: 1px solid #eee; border-radius: 8px; font-size: 14px;
  }
  .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #aaa; flex-shrink: 0; }
  .online-dot.online { background: #4caf50; }
  #all-rooms-list { display: flex; flex-direction: column; gap: 8px; }
  .browse-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; border: 1px solid #eee; border-radius: 8px; font-size: 14px;
  }
  .browse-item button { padding: 5px 14px; border: none; border-radius: 6px; cursor: pointer; background: #fee500; font-size: 12px; font-weight: bold; }
  .browse-item button.joined { background: #ddd; color: #888; cursor: default; }

  /* ── 프로필 탭 ── */
  #tab-profile { flex-direction: column; background: #fff; align-items: center; justify-content: center; }
  #profile-inner { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 300px; }
  #profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: #313244; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #cdd6f4; }
  #profile-username { font-size: 20px; font-weight: bold; }
  #status-input {
    width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 14px; text-align: center;
  }
  #logout-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; background: #ff6b6b; color: #fff; font-weight: bold; font-size: 15px; }

  /* ── 오버레이 공통 ── */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .overlay.hidden { display: none; }
  .modal-box {
    background: #fff; padding: 32px; border-radius: 12px;
    display: flex; flex-direction: column; gap: 12px; width: 300px;
  }
  .modal-box h2 { text-align: center; }
  .modal-box input {
    padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px;
  }
  .modal-box .row { display: flex; gap: 8px; }
  .modal-box .row button { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; background: #fee500; font-weight: bold; }
  .modal-box .row button.secondary { background: #eee; color: #333; }
  .error-msg { color: red; font-size: 12px; text-align: center; }
  .success-msg { color: green; font-size: 12px; text-align: center; }

  /* ── 모바일: 하단 탭 ── */
  @media (max-width: 600px) {
    #app-header { display: none; }
    body { flex-direction: column; }
    #tab-nav-bottom {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0;
      background: #1e1e2e; height: 56px; z-index: 50;
    }
    .tab-btn-bottom {
      flex: 1; border: none; background: transparent; color: #cdd6f4;
      font-size: 11px; cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px;
    }
    .tab-btn-bottom.active { color: #89b4fa; }
    .tab-btn-bottom span { font-size: 18px; }
    .tab-content.active { padding-bottom: 56px; }
    #sidebar { width: 100%; max-width: 100%; }
    #tab-chat { flex-direction: column; }
  }
  @media (min-width: 601px) {
    #tab-nav-bottom { display: none; }
  }
</style>
</head>
<body>

<!-- 상단 헤더 & 탭 (웹) -->
<header id="app-header">
  <div id="app-title">💬 ChatApp</div>
  <nav id="tab-nav">
    <button class="tab-btn active" onclick="switchTab('chat')">💬 채팅</button>
    <button class="tab-btn" onclick="switchTab('friends')">👥 친구</button>
    <button class="tab-btn" onclick="switchTab('profile')">👤 프로필</button>
  </nav>
</header>

<!-- 채팅 탭 -->
<div id="tab-chat" class="tab-content active">
  <div id="sidebar">
    <h2>채팅방</h2>
    <div id="room-list"></div>
    <div id="sidebar-actions">
      <button class="sidebar-btn yellow" onclick="createRoom()">+ 방 만들기</button>
    </div>
  </div>
  <div id="chat-main">
    <div id="room-header" class="hidden">
      <span id="room-title"></span>
      <button id="leave-btn" onclick="leaveRoom()">나가기</button>
    </div>
    <div id="messages"></div>
    <div id="input-area">
      <input id="msg-input" placeholder="메시지 입력..." onkeydown="if(event.key==='Enter') sendMsg()" />
      <button id="send-btn" onclick="sendMsg()">전송</button>
    </div>
  </div>
</div>

<!-- 친구 탭 -->
<div id="tab-friends" class="tab-content">
  <div id="friends-inner">
    <div>
      <div class="section-title">👤 유저 검색</div>
      <div id="user-search-box">
        <input id="user-search-input" placeholder="아이디 검색..." />
        <button id="user-search-btn" onclick="searchUser()">검색</button>
      </div>
      <div id="search-result"></div>
    </div>
    <div>
      <div class="section-title">👥 친구 목록</div>
      <div id="friend-list"><div style="color:#aaa;font-size:13px;">아직 친구가 없습니다.</div></div>
    </div>
    <div>
      <div class="section-title">🔍 전체 채팅방</div>
      <div id="all-rooms-list"></div>
    </div>
  </div>
</div>

<!-- 프로필 탭 -->
<div id="tab-profile" class="tab-content">
  <div id="profile-inner">
    <div id="profile-avatar">👤</div>
    <div id="profile-username">-</div>
    <input id="status-input" placeholder="상태 메시지를 입력하세요..." />
    <button id="logout-btn" onclick="logout()">로그아웃</button>
  </div>
</div>

<!-- 하단 탭 (모바일) -->
<nav id="tab-nav-bottom">
  <button class="tab-btn-bottom active" onclick="switchTab('chat')"><span>💬</span>채팅</button>
  <button class="tab-btn-bottom" onclick="switchTab('friends')"><span>👥</span>친구</button>
  <button class="tab-btn-bottom" onclick="switchTab('profile')"><span>👤</span>프로필</button>
</nav>

<!-- 로그인 오버레이 -->
<div id="overlay" class="overlay">
  <div class="modal-box">
    <h2>ChatApp</h2>
    <input id="un" placeholder="아이디" />
    <input id="pw" placeholder="비밀번호" type="password" onkeydown="if(event.key==='Enter') doLogin()" />
    <div class="row">
      <button onclick="doLogin()">로그인</button>
      <button class="secondary" onclick="openRegister()">회원가입</button>
    </div>
    <div id="login-error" class="error-msg"></div>
  </div>
</div>

<!-- 회원가입 오버레이 -->
<div id="register-overlay" class="overlay hidden">
  <div class="modal-box">
    <h2>회원가입</h2>
    <input id="reg-un" placeholder="아이디" />
    <input id="reg-pw" placeholder="비밀번호" type="password" />
    <input id="reg-pw2" placeholder="비밀번호 확인" type="password" />
    <div class="row">
      <button class="secondary" onclick="closeRegister()">취소</button>
      <button onclick="doRegister()">가입하기</button>
    </div>
    <div id="register-error" class="error-msg"></div>
  </div>
</div>

<script>
let token = null;
let currentRoom = null;
let ws = null;
let currentUsername = null;

// 페이지 로드 시 저장된 로그인 정보 복원
(async () => {
  const savedToken = localStorage.getItem("token");
  const savedUsername = localStorage.getItem("username");
  if (savedToken && savedUsername) {
    try {
      token = savedToken;
      currentUsername = savedUsername;
      await onLoginSuccess(savedToken, savedUsername);
    } catch (e) {
      localStorage.removeItem("token");
      localStorage.removeItem("username");
    }
  }
})();

// ── 탭 전환 ──────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".tab-btn, .tab-btn-bottom").forEach(el => el.classList.remove("active"));
  document.getElementById(`tab-${name}`).classList.add("active");
  document.querySelectorAll(`[onclick="switchTab('${name}')"]`).forEach(el => el.classList.add("active"));
  if (name === "friends") loadAllRooms();
  if (name === "profile") loadProfile();
}

// ── API ──────────────────────────────────────────
async function api(method, path, body) {
  const url = new URL(path, location.href);
  if (token) url.searchParams.set("token", token);
  const res = await fetch(url, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.detail || "오류");
  return data;
}

// ── 인증 ─────────────────────────────────────────
async function doLogin() {
  try {
    const r = await api("POST", "/login", {
      username: document.getElementById("un").value,
      password: document.getElementById("pw").value,
    });
    await onLoginSuccess(r.token, document.getElementById("un").value);
  } catch (e) {
    document.getElementById("login-error").textContent = e.message;
  }
}

function openRegister() {
  document.getElementById("register-error").textContent = "";
  document.getElementById("reg-un").value = "";
  document.getElementById("reg-pw").value = "";
  document.getElementById("reg-pw2").value = "";
  document.getElementById("register-overlay").classList.remove("hidden");
}

function closeRegister() {
  document.getElementById("register-overlay").classList.add("hidden");
}

async function doRegister() {
  const username = document.getElementById("reg-un").value.trim();
  const password = document.getElementById("reg-pw").value;
  const password2 = document.getElementById("reg-pw2").value;
  const errEl = document.getElementById("register-error");
  if (!username || !password) { errEl.textContent = "아이디와 비밀번호를 입력해주세요."; return; }
  if (password !== password2) { errEl.textContent = "비밀번호가 일치하지 않습니다."; return; }
  try {
    await api("POST", "/register", { username, password });
    closeRegister();
    document.getElementById("un").value = username;
    document.getElementById("pw").value = "";
    document.getElementById("login-error").textContent = "가입 완료! 로그인해주세요.";
    document.getElementById("login-error").style.color = "green";
  } catch (e) {
    errEl.textContent = e.message;
  }
}

async function onLoginSuccess(t, username) {
  token = t;
  currentUsername = username;
  localStorage.setItem("token", t);
  localStorage.setItem("username", username);
  document.getElementById("overlay").classList.add("hidden");
  await loadRooms();
}

function logout() {
  token = null;
  currentUsername = null;
  localStorage.removeItem("token");
  localStorage.removeItem("username");
  if (ws) { ws.close(); ws = null; }
  currentRoom = null;
  document.getElementById("messages").innerHTML = "";
  document.getElementById("room-header").classList.add("hidden");
  document.getElementById("un").value = "";
  document.getElementById("pw").value = "";
  document.getElementById("login-error").textContent = "";
  document.getElementById("login-error").style.color = "red";
  document.getElementById("overlay").classList.remove("hidden");
  switchTab("chat");
}

// ── 채팅방 ────────────────────────────────────────
async function loadRooms() {
  const rooms = await api("GET", "/rooms");
  const list = document.getElementById("room-list");
  list.innerHTML = "";
  rooms.forEach(r => {
    const div = document.createElement("div");
    div.className = "room-item";
    div.textContent = "# " + r.name;
    div.onclick = () => joinRoom(r.id, r.name, div);
    list.appendChild(div);
  });
}

async function createRoom() {
  const name = prompt("방 이름:");
  if (!name) return;
  await api("POST", "/rooms", { name });
  await loadRooms();
}

async function joinRoom(roomId, roomName, el) {
  switchTab("chat");
  document.querySelectorAll(".room-item").forEach(e => e.classList.remove("active"));
  el.classList.add("active");
  currentRoom = roomId;
  document.getElementById("room-title").textContent = "# " + roomName;
  document.getElementById("room-header").classList.remove("hidden");
  await api("POST", `/rooms/${roomId}/join`);
  if (ws) ws.close();
  const msgs = await api("GET", `/rooms/${roomId}/messages`);
  renderHistory(msgs);
  const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${wsProtocol}//${location.host}/ws/${roomId}?token=${token}`;
  ws = new WebSocket(wsUrl);
  ws.onmessage = e => {
    const data = JSON.parse(e.data);
    if (data.type === "system") appendSystem(data.content);
    else appendMessage(data.sender, data.content, false);
  };
}

async function leaveRoom() {
  if (!currentRoom) return;
  try { await api("DELETE", `/rooms/${currentRoom}/leave`); } catch (_) {}
  if (ws) { ws.close(); ws = null; }
  currentRoom = null;
  document.getElementById("messages").innerHTML = "";
  document.getElementById("room-header").classList.add("hidden");
  document.querySelectorAll(".room-item").forEach(e => e.classList.remove("active"));
  await loadRooms();
}

function renderHistory(msgs) {
  document.getElementById("messages").innerHTML = "";
  msgs.forEach(m => appendMessage(m.sender, m.content, m.sender === currentUsername));
}

function appendMessage(sender, content, isMine) {
  const box = document.getElementById("messages");
  const row = document.createElement("div");
  row.className = "msg-row " + (isMine ? "mine" : "theirs");
  row.innerHTML = `<div class="msg-sender">${sender}</div><div class="msg-bubble">${escHtml(content)}</div>`;
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}

function appendSystem(text) {
  const box = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "system-msg";
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function sendMsg() {
  const input = document.getElementById("msg-input");
  const text = input.value.trim();
  if (!text || !ws) return;
  ws.send(text);
  appendMessage("나", text, true);
  input.value = "";
}

// ── 친구 탭 ──────────────────────────────────────
async function searchUser() {
  const query = document.getElementById("user-search-input").value.trim();
  if (!query) return;
  const resultEl = document.getElementById("search-result");
  resultEl.innerHTML = "<div style='color:#aaa;font-size:13px;'>검색 중...</div>";
  try {
    const users = await api("GET", `/users/search?q=${encodeURIComponent(query)}`);
    resultEl.innerHTML = "";
    if (users.length === 0) {
      resultEl.innerHTML = "<div style='color:#aaa;font-size:13px;'>검색 결과가 없습니다.</div>";
      return;
    }
    users.forEach(u => {
      const item = document.createElement("div");
      item.className = "user-item";
      item.innerHTML = `<span>👤 ${escHtml(u.username)}</span><button onclick="addFriend('${escHtml(u.username)}', this)">친구 추가</button>`;
      resultEl.appendChild(item);
    });
  } catch (e) {
    resultEl.innerHTML = `<div style='color:red;font-size:13px;'>${e.message}</div>`;
  }
}

async function addFriend(username, btn) {
  btn.textContent = "추가됨";
  btn.disabled = true;
  btn.style.background = "#ddd";
}

async function loadAllRooms() {
  const rooms = await api("GET", "/rooms/all");
  const list = document.getElementById("all-rooms-list");
  list.innerHTML = "";
  if (rooms.length === 0) {
    list.innerHTML = "<div style='color:#aaa;font-size:13px;'>개설된 방이 없습니다.</div>";
    return;
  }
  rooms.forEach(r => {
    const item = document.createElement("div");
    item.className = "browse-item";
    item.innerHTML = `
      <span># ${escHtml(r.name)}</span>
      <button class="${r.joined ? 'joined' : ''}" onclick="browseJoin(${r.id}, '${escHtml(r.name)}', this)" ${r.joined ? 'disabled' : ''}>
        ${r.joined ? '참가중' : '참가'}
      </button>`;
    list.appendChild(item);
  });
}

async function browseJoin(roomId, roomName, btn) {
  await api("POST", `/rooms/${roomId}/join`);
  btn.textContent = "참가중";
  btn.classList.add("joined");
  btn.disabled = true;
  await loadRooms();
}

// ── 프로필 탭 ────────────────────────────────────
function loadProfile() {
  document.getElementById("profile-username").textContent = currentUsername || "-";
}

// ── 유틸 ─────────────────────────────────────────
function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
</script>
</body>
</html>
